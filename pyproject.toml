[build-system]
requires = ["setuptools>=77", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "conway-agent"
version = "0.6.0"
description = "Local-first headless autonomous computer-use agent harness"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Conway contributors" }]
keywords = ["agent", "computer-use", "vlm", "local-ai"]
dependencies = [
  "httpx>=0.27,<1", "platformdirs>=4,<5", "psutil>=6,<8", "PyYAML>=6,<7",
  "pyautogui>=0.9.54,<1", "pyperclip>=1.9,<2", "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "coverage>=7,<8"]
accessibility = [
  "pywinauto>=0.6.8,<0.7; sys_platform == 'win32'",
  "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
]

[project.scripts]
conway = "conway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["conway*"]

[tool.setuptools.package-data]
conway = ["*.yaml", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["conway"]

[tool.coverage.report]
show_missing = true
