[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "conway-agent"
version = "0.2.0"
description = "Local-first headless autonomous computer-use agent harness"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Conway contributors" }]
keywords = ["agent", "computer-use", "vlm", "local-ai", "automation"]
dependencies = [
  "httpx>=0.27,<1",
  "platformdirs>=4,<5",
  "psutil>=6,<8",
  "PyYAML>=6,<7",
  "pyautogui>=0.9.54,<1",
  "pyperclip>=1.9,<2",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
conway = "conway.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/conway"]

[tool.hatch.build.targets.wheel.force-include]
"src/conway/models.yaml" = "conway/models.yaml"
"src/conway/constitution.default.md" = "conway/constitution.default.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
