[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "conway-agent"
version = "0.1.0"
description = "Local-first headless autonomous computer-use agent harness"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Conway contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "platformdirs>=4,<5",
  "psutil>=6,<8",
  "PyYAML>=6,<7",
  "pyautogui>=0.9.54,<1",
  "Pillow>=10,<12",
]

[project.scripts]
conway = "conway.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/conway"]

[tool.hatch.build.targets.wheel.force-include]
"src/conway/models.yaml" = "conway/models.yaml"
"src/conway/constitution.default.md" = "conway/constitution.default.md"
