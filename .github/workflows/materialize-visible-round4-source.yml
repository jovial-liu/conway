name: Materialize visible round4 source

on:
  push:
    branches: [paper/verified-rerun-integration]
    paths:
      - '.github/workflows/materialize-visible-round4-source.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SVG and TeX tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            librsvg2-bin zip unzip \
            texlive-latex-extra texlive-fonts-recommended texlive-science

      - name: Materialize current figures and packages
        run: |
          set -euo pipefail
          root="paper/review_round4_20260914"
          old="paper/local_rerun_revision/source/figures"
          mkdir -p "$root/source/figures" "$root/reference_figures" "$root/generated"

          # Keep editable/source graphics visible as ordinary GitHub files.
          cp "$old/figure1_method_final.svg" "$root/source/figures/figure1_method_clean.svg"
          cp "$old/figure2_identification_final.svg" "$root/source/figures/figure2_identification_final.svg"

          # Re-export the visible SVGs to clean standalone PDFs. This avoids the
          # old Figure-1 full-page PDF object's hidden-manuscript text.
          rsvg-convert -f pdf -o "$root/source/figures/figure1_method_clean.pdf" \
            "$root/source/figures/figure1_method_clean.svg"
          rsvg-convert -f pdf -o "$root/source/figures/figure2_identification_final.pdf" \
            "$root/source/figures/figure2_identification_final.svg"

          # Preserve previous Figure 2/3 files as directly inspectable repository
          # files, not only as ZIP members.
          cp "$old/figure2_identification_final.pdf" "$root/reference_figures/figure2_previous_round3.pdf"
          cp "$old/figure2_identification_final.svg" "$root/reference_figures/figure2_previous_round3.svg"
          cp "$old/figure3_qualitative_final.pdf" "$root/reference_figures/figure3_previous_round3.pdf"
          cp "$old/figure3_qualitative_final.svg" "$root/reference_figures/figure3_previous_round3.svg"
          cp "$old/qualitative_cases_compact_labels.png" "$root/reference_figures/figure3_previous_round3_pixels.png"

          # Current Round-4 Figure 3 is inline LaTeX in main.tex, so there is no
          # external current Figure-3 binary to hide inside a ZIP.
          rm -rf "$root/arxiv_source"
          cp -a "$root/source" "$root/arxiv_source"

          # Confirm the expanded source compiles before packaging.
          (cd "$root/source" && pdflatex -interaction=nonstopmode -halt-on-error main.tex >/tmp/round4-source.log)
          pages=$(pdfinfo "$root/source/main.pdf" 2>/dev/null | awk '/^Pages:/ {print $2}' || true)
          if [ -n "$pages" ]; then test "$pages" = "5"; fi
          rm -f "$root/source/main.aux" "$root/source/main.log" "$root/source/main.out" "$root/source/main.pdf"

          rm -f "$root/generated/ccf0_round4_20260914_arxiv.zip" \
                "$root/generated/ccf0_round4_20260914_source.zip"
          (cd "$root/arxiv_source" && zip -qr "../generated/ccf0_round4_20260914_arxiv.zip" .)
          (cd "$root" && zip -qr generated/ccf0_round4_20260914_source.zip \
            source arxiv_source reference_figures README.md VISIBLE_SOURCE_NOTE.md)

          unzip -t "$root/generated/ccf0_round4_20260914_arxiv.zip"
          unzip -t "$root/generated/ccf0_round4_20260914_source.zip"
          sha256sum \
            "$root/generated/ccf0_round4_20260914_source.zip" \
            "$root/generated/ccf0_round4_20260914_arxiv.zip" \
            > "$root/generated/SOURCE_SHA256SUMS.txt"

      - name: Commit visible source and figures
        run: |
          set -euo pipefail
          git config user.name "Paper source materializer"
          git config user.email "paper-source@users.noreply.github.com"
          git rm -f handoff/round4/ccf0_round4_20260914_arxiv.zip.b64 2>/dev/null || true
          git rm -f paper/review_round4_20260914/source/figures/figure1_method_clean.pdf.b64 2>/dev/null || true
          git rm -r -f handoff/round4/figure_b64_parts 2>/dev/null || true
          git add paper/review_round4_20260914/source \
                  paper/review_round4_20260914/arxiv_source \
                  paper/review_round4_20260914/reference_figures \
                  paper/review_round4_20260914/generated/ccf0_round4_20260914_source.zip \
                  paper/review_round4_20260914/generated/ccf0_round4_20260914_arxiv.zip \
                  paper/review_round4_20260914/generated/SOURCE_SHA256SUMS.txt \
                  paper/review_round4_20260914/VISIBLE_SOURCE_NOTE.md
          if ! git diff --cached --quiet; then
            git commit -m "Materialize current Round-4 source and visible figures"
            git push origin HEAD:paper/verified-rerun-integration
          fi
