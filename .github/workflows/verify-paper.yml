name: Verify revised paper
on:
  push:
    branches: [paper/verified-rerun-integration]
    paths:
      - 'paper/local_rerun_revision/source/**'
      - 'paper/local_rerun_revision/arxiv_source/**'
      - 'paper/local_rerun_revision/verify_build.py'
      - '.github/workflows/verify-paper.yml'
permissions:
  contents: write
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX and PDF inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended texlive-science python3-fitz
      - name: Compile and inspect both paper sources
        run: /usr/bin/python3 paper/local_rerun_revision/verify_build.py
      - name: Save generated results to the revision branch
        if: always()
        run: |
          git config user.name "Paper build"
          git config user.email "paper-build@users.noreply.github.com"
          git add paper/local_rerun_revision/generated/
          if ! git diff --cached --quiet; then
            git commit -m "Record paper compilation and PDF checks"
            git push origin HEAD:paper/verified-rerun-integration
          fi
