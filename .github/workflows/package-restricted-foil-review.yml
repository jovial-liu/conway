name: Package restricted-foil review evidence
on:
  push:
    branches: [paper/verified-rerun-integration]
    paths: ['.github/workflows/package-restricted-foil-review.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6a52e8f3d39f343d8483390882dcb5e57003d904
          persist-credentials: false
      - name: Create immutable input manifest
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('experiments/reviewer_controls_2026-09-13')
          entries=[]
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  b=p.read_bytes()
                  entries.append({'path':str(p.relative_to(root)),'size':len(b),'sha256':hashlib.sha256(b).hexdigest(),'git_blob_sha1':hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()})
          pathlib.Path('restricted_foil_transport_manifest.json').write_text(json.dumps({'commit':'6a52e8f3d39f343d8483390882dcb5e57003d904','files':entries},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ccf0-restricted-foil-pinned-evidence
          path: |
            experiments/reviewer_controls_2026-09-13/
            restricted_foil_transport_manifest.json
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
