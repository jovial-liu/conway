name: Mirror repository to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huggingface-source-publication
  cancel-in-progress: false

jobs:
  mirror:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install publication client
        run: python -m pip install 'huggingface_hub>=0.34,<2'
      - name: Validate source selection without credentials
        run: python scripts/publish_hf.py --dry-run
      - name: Publish and verify source snapshot
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/publish_hf.py --repo jnjnkj/conway
